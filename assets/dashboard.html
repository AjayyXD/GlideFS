<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlideFS Dashboard</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel-border: #1f2733;
    --accent: #4fd1c5;
    --accent2: #7c9eff;
    --text: #e6edf3;
    --muted: #8b98a5;
    --danger: #ff6b6b;
    --ok: #52d17c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #14202b 0%, var(--bg) 60%);
    color: var(--text);
    padding: 28px 32px 60px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #06141c; font-size: 18px;
  }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(82, 209, 124, 0.12); color: var(--ok);
    border: 1px solid rgba(82, 209, 124, 0.3);
    padding: 6px 12px; border-radius: 999px; font-size: 13px;
  }
  .status-pill.offline { background: rgba(255,107,107,0.12); color: var(--danger); border-color: rgba(255,107,107,0.3); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 18px 20px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 6px; }
  .card .value small { font-size: 14px; color: var(--muted); font-weight: 400; }

  .panels { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; }
  @media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 18px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .panel h2::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  .empty { color: var(--muted); font-style: italic; font-size: 13px; padding: 10px 0; }

  pre {
    background: #0a0e13; border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 12px; font-size: 12px; overflow-x: auto; color: #c7d1db;
    max-height: 260px; overflow-y: auto; white-space: pre; margin: 0;
  }
  .node-map { display: flex; align-items: center; justify-content: center; padding: 20px 0; }
  .node-map svg { width: 100%; max-width: 420px; height: auto; }
  .footer-note { color: var(--muted); font-size: 12px; margin-top: 30px; text-align: center; }
  code { background: rgba(255,255,255,0.06); padding: 1px 6px; border-radius: 5px; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">GF</div>
      <div>
        <h1>GlideFS</h1>
        <div class="sub" id="shareLine">connecting…</div>
      </div>
    </div>
    <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">connecting</span></div>
  </header>

  <div class="grid">
    <div class="card"><div class="label">SSID</div><div class="value" id="ssid">–</div></div>
    <div class="card"><div class="label">Connected Devices</div><div class="value" id="deviceCount">0</div></div>
    <div class="card"><div class="label">Download</div><div class="value" id="rxRate">0 <small>KB/s</small></div></div>
    <div class="card"><div class="label">Upload</div><div class="value" id="txRate">0 <small>KB/s</small></div></div>
  </div>

  <div class="panels">
    <div>
      <div class="panel">
        <h2>Connected Devices</h2>
        <table id="deviceTable">
          <thead><tr><th>IP Address</th><th>MAC Address</th><th>State</th></tr></thead>
          <tbody><tr><td colspan="3" class="empty">No devices connected yet</td></tr></tbody>
        </table>
      </div>
      <div class="panel">
        <h2>Active Locks</h2>
        <pre id="locksBox">–</pre>
      </div>
    </div>
    <div>
      <div class="panel">
        <h2>Network Map</h2>
        <div class="node-map">
          <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="150" cy="40" r="22" fill="#4fd1c5" opacity="0.9"/>
            <text x="150" y="45" text-anchor="middle" font-size="11" fill="#06141c" font-weight="700">HOST</text>
            <g id="clientNodes"></g>
          </svg>
        </div>
      </div>
      <div class="panel">
        <h2>Active Sessions</h2>
        <pre id="sessionsBox">–</pre>
      </div>
    </div>
  </div>

  <div class="footer-note">GlideFS local dashboard &middot; refreshes every 2s &middot; served from the host machine only</div>

<script>
  const fmt = (bytes) => {
    if (bytes < 1024) return bytes.toFixed(0) + ' B/s';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB/s';
    return (bytes/1024/1024).toFixed(2) + ' MB/s';
  };

  function renderNodes(devices) {
    const g = document.getElementById('clientNodes');
    g.innerHTML = '';
    const n = devices.length;
    if (n === 0) return;
    const radius = 85;
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i) / n - Math.PI/2;
      const cx = 150 + radius * Math.cos(angle);
      const cy = 130 + 40 * Math.sin(angle) + 20;
      g.innerHTML += `
        <line x1="150" y1="60" x2="${cx}" y2="${cy}" stroke="#2a3a4a" stroke-width="1.5"/>
        <circle cx="${cx}" cy="${cy}" r="14" fill="#7c9eff"/>
        <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="8" fill="#06141c" font-weight="700">${i+1}</text>
      `;
    }
  }

  async function poll() {
    try {
      const res = await fetch('/api/status', {cache: 'no-store'});
      const data = await res.json();

      document.getElementById('statusPill').classList.remove('offline');
      document.getElementById('statusText').textContent = 'online';
      document.getElementById('shareLine').textContent =
        `sharing "${data.share_path}" as \\\\${data.host_ip}\\${data.share_name}`;
      document.getElementById('ssid').textContent = data.ssid || '–';
      document.getElementById('deviceCount').textContent = data.devices.length;
      document.getElementById('rxRate').innerHTML = fmt(data.throughput.rx_bps).split(' ')[0] + ' <small>' + fmt(data.throughput.rx_bps).split(' ')[1] + '</small>';
      document.getElementById('txRate').innerHTML = fmt(data.throughput.tx_bps).split(' ')[0] + ' <small>' + fmt(data.throughput.tx_bps).split(' ')[1] + '</small>';

      const tbody = document.querySelector('#deviceTable tbody');
      if (data.devices.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty">No devices connected yet</td></tr>';
      } else {
        tbody.innerHTML = data.devices.map(d =>
          `<tr><td>${d.ip}</td><td>${d.mac}</td><td>${d.state}</td></tr>`
        ).join('');
      }
      renderNodes(data.devices);

      document.getElementById('sessionsBox').textContent = data.smb_sessions_raw || '(no active sessions)';
      document.getElementById('locksBox').textContent = data.smb_locks_raw || '(no active locks)';
    } catch (e) {
      document.getElementById('statusPill').classList.add('offline');
      document.getElementById('statusText').textContent = 'offline';
    }
  }
  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>

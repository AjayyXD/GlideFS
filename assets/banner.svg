<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="55%" stop-color="#0d1620"/>
      <stop offset="100%" stop-color="#0f1a20"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#7c9eff"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- subtle dot grid texture -->
  <g opacity="0.12">
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#4fd1c5"/>
    </pattern>
    <rect width="1200" height="320" fill="url(#dots)"/>
  </g>

  <!-- network glyph, right side -->
  <g transform="translate(985,120) scale(0.85)">
    <circle r="70" fill="url(#pulse)"/>
    <circle r="46" fill="none" stroke="#233041" stroke-width="1.5"/>
    <circle r="30" fill="none" stroke="#2a3a4a" stroke-width="1.5"/>

    <!-- host -->
    <circle cx="0" cy="0" r="17" fill="#4fd1c5"/>
    <text x="0" y="4" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="10" font-weight="700" fill="#06141c">HOST</text>

    <!-- hotspot clients -->
    <line x1="0" y1="0" x2="-78" y2="-46" stroke="#3a4a5c" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="-92" y2="18" stroke="#3a4a5c" stroke-width="1.5"/>
    <circle cx="-78" cy="-46" r="10" fill="#7c9eff"/>
    <circle cx="-92" cy="18" r="10" fill="#7c9eff"/>

    <!-- mesh / tailscale peer, dashed WAN link -->
    <line x1="0" y1="0" x2="100" y2="-58" stroke="#4fd1c5" stroke-width="1.5" stroke-dasharray="4 5"/>
    <circle cx="100" cy="-58" r="10" fill="#0b0f14" stroke="#4fd1c5" stroke-width="2"/>
    <text x="122" y="-54" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#8b98a5">mesh</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(90,140)">
    <text x="0" y="0" font-family="'DejaVu Sans', sans-serif" font-size="72" font-weight="700" fill="url(#wordmark)">GlideFS</text>
    <text x="4" y="42" font-family="'DejaVu Sans', sans-serif" font-size="19" fill="#8b98a5">Zero-config folder sharing over WiFi — with a Tailscale mesh fallback</text>
  </g>

  <!-- small badge row -->
  <g transform="translate(94,225)" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#4fd1c5">
    <circle cx="4" cy="-4" r="3" fill="#52d17c"/>
    <text x="14" y="0">Samba oplocks</text>
    <circle cx="140" cy="-4" r="3" fill="#7c9eff"/>
    <text x="150" y="0" fill="#7c9eff">Live dashboard</text>
    <circle cx="275" cy="-4" r="3" fill="#4fd1c5"/>
    <text x="285" y="0">Tailscale mesh</text>
  </g>
</svg>
